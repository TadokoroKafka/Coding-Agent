[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nju-coding-agent"
version = "0.1.0"
description = "A standalone, locally executed coding agent using native model tool calling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that call the real DeepSeek API"]
